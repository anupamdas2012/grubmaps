name: Deploy web frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo Settings → Secrets and variables → Actions → New repository variable:
#   VITE_API_URL   = https://crave-grubmaps.fly.dev
#   VITE_BASE_PATH = /grubmaps/    (must match your GH repo name)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_API_URL:   ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true          # auto-enable Pages if it isn't yet

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
