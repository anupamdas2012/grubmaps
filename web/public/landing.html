<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crave — your personal tour of the good stuff." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Crave — your personal tour of the good stuff</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0c; color: #f5f5f4; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .stage { position: fixed; inset: 0; overflow: hidden; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.75) 100%); }
      .content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; padding: clamp(20px, 4vw, 40px); }
      .spacer { flex: 1; }
      .bottom { display: flex; flex-direction: column; gap: 18px; }
      .wordmark { font-family: "Anton", sans-serif; font-size: clamp(28px, 4vw, 40px); letter-spacing: 0.04em; text-transform: uppercase; }
      .hero { max-width: 720px; }
      h1 { font-family: "Anton", sans-serif; font-weight: 400; font-size: clamp(44px, 8vw, 96px); line-height: 0.95; letter-spacing: 0.01em; margin: 0 0 16px; text-transform: uppercase; }
      p.tag { font-size: clamp(16px, 1.8vw, 20px); line-height: 1.4; margin: 0 0 28px; color: #e7e5e4; max-width: 40ch; }
      .cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; background: #fff; color: #0b0b0c; text-decoration: none; font-weight: 600; font-size: 16px; transition: transform 120ms ease; }
      .cta:hover { transform: translateY(-1px); }
      .cta svg { width: 16px; height: 16px; }
      footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: rgba(245,245,244,0.7); }
      footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.3); }
    </style>
  </head>
  <body>
    <div class="stage">
      <video autoplay muted loop playsinline preload="auto" poster="">
        <source src="./hero.mp4" type="video/mp4" />
      </video>
      <div class="veil"></div>
      <div class="content">
        <div class="wordmark">Crave</div>
        <div class="spacer"></div>
        <div class="bottom">
          <div class="hero">
            <h1>Eat the good stuff.</h1>
            <p class="tag">Your personal tour of what's actually worth ordering — one dish at a time.</p>
            <a class="cta" href="./">
              Open the map
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </a>
          </div>
          <footer>
            <span>© Crave</span>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
